{% extends "base.html" %}

{% block title %}Sign In — PocketSmart AI{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3rem auto;">
  <div class="glass-panel">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">✨</div>
      <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your saved lifestyle budgets</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username or Email</label>
        <input type="text" id="username" class="form-control" placeholder="e.g. john_doe" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
        Sign In to PocketSmart
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="/register" style="color: var(--accent-primary); font-weight: 600; text-decoration: none;">Create one here</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Authenticating...';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      showToast(data.detail || 'Failed to sign in', 'error');
      btn.disabled = false;
      btn.textContent = 'Sign In to PocketSmart';
    } else {
      showToast('Welcome back, ' + data.user.username + '!', 'success');
      setTimeout(() => { window.location.href = '/dashboard'; }, 800);
    }
  } catch (err) {
    showToast('Network error, please try again.', 'error');
    btn.disabled = false;
    btn.textContent = 'Sign In to PocketSmart';
  }
});
</script>
{% endblock %}
