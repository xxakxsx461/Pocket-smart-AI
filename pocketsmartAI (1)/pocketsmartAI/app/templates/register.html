{% extends "base.html" %}

{% block title %}Create Account — PocketSmart AI{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="glass-panel">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">✨</div>
      <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Create Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Join PocketSmart AI for personalized lifestyle planning</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="reg-fullname">Full Name</label>
        <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. John Doe">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-username">Username</label>
        <input type="text" id="reg-username" class="form-control" placeholder="e.g. john_doe" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address</label>
        <input type="email" id="reg-email" class="form-control" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Password (min. 6 characters)</label>
        <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" id="reg-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
        Get Started
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? <a href="/login" style="color: var(--accent-primary); font-weight: 600; text-decoration: none;">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('reg-btn');
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  const full_name = document.getElementById('reg-fullname').value.trim();
  const username = document.getElementById('reg-username').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;

  try {
    const res = await fetch('/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ full_name, username, email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      showToast(data.detail || 'Registration failed', 'error');
      btn.disabled = false;
      btn.textContent = 'Get Started';
    } else {
      showToast('Account created successfully!', 'success');
      setTimeout(() => { window.location.href = '/dashboard'; }, 800);
    }
  } catch (err) {
    showToast('Network error, please try again.', 'error');
    btn.disabled = false;
    btn.textContent = 'Get Started';
  }
});
</script>
{% endblock %}
